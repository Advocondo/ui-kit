<!-- @dsCard group="Colors" viewport="700x170" name="Status — trios fg/bg/borda" subtitle="Cada estado usa fundo claro, borda média e texto escuro" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r"><div class="sw" style="width:118px"><div style="display:grid;place-items:center;height:56px;border-radius:var(--radius-pill);background:var(--status-ok-bg);border:1px solid var(--status-ok-border);color:var(--status-ok-fg);font:var(--fw-medium) 12px/1.4 var(--font-sans)">Ganho / em dia</div><p class="v">--status-ok-*</p></div><div class="sw" style="width:118px"><div style="display:grid;place-items:center;height:56px;border-radius:var(--radius-pill);background:var(--status-warn-bg);border:1px solid var(--status-warn-border);color:var(--status-warn-fg);font:var(--fw-medium) 12px/1.4 var(--font-sans)">Prazo próximo</div><p class="v">--status-warn-*</p></div><div class="sw" style="width:118px"><div style="display:grid;place-items:center;height:56px;border-radius:var(--radius-pill);background:var(--status-risk-bg);border:1px solid var(--status-risk-border);color:var(--status-risk-fg);font:var(--fw-medium) 12px/1.4 var(--font-sans)">Prazo fatal</div><p class="v">--status-risk-*</p></div><div class="sw" style="width:118px"><div style="display:grid;place-items:center;height:56px;border-radius:var(--radius-pill);background:var(--status-info-bg);border:1px solid var(--status-info-border);color:var(--status-info-fg);font:var(--fw-medium) 12px/1.4 var(--font-sans)">Ativo</div><p class="v">--status-info-*</p></div><div class="sw" style="width:118px"><div style="display:grid;place-items:center;height:56px;border-radius:var(--radius-pill);background:var(--status-neutral-bg);border:1px solid var(--status-neutral-border);color:var(--status-neutral-fg);font:var(--fw-medium) 12px/1.4 var(--font-sans)">Arquivado</div><p class="v">--status-neutral-*</p></div></div></body></html>
