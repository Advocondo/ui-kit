<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="gap:16px"><div class="sw" style="width:120px"><div style="height:56px;background:var(--stone-0);border-radius:var(--radius-sm);box-shadow:var(--shadow-xs)"></div><p class="v">--shadow-xs</p></div><div class="sw" style="width:120px"><div style="height:56px;background:var(--stone-0);border-radius:var(--radius-sm);box-shadow:var(--shadow-sm)"></div><p class="v">--shadow-sm</p></div><div class="sw" style="width:120px"><div style="height:56px;background:var(--stone-0);border-radius:var(--radius-sm);box-shadow:var(--shadow-md)"></div><p class="v">--shadow-md</p></div><div class="sw" style="width:120px"><div style="height:56px;background:var(--stone-0);border-radius:var(--radius-sm);box-shadow:var(--shadow-lg)"></div><p class="v">--shadow-lg</p></div>
<div class="sw" style="width:130px"><div style="height:56px;background:var(--navy-900);border-radius:var(--radius-sm);display:grid;place-items:center"><div style="width:70%;height:60%;background:var(--stone-200);border-radius:var(--radius-md);box-shadow:var(--shadow-card-site)"></div></div><p class="v">--shadow-card-site</p></div></div></body></html>
