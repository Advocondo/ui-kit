<!-- @dsCard group="Spacing" viewport="700x170" name="Grade da plataforma" subtitle="Sidebar 248px fixa, topbar 60px, conteúdo com 24px de padding" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;height:120px;border:1px solid var(--border-subtle);border-radius:var(--radius-sm);overflow:hidden">
<div style="width:124px;background:var(--navy-900);display:grid;place-items:center"><p class="v" style="color:rgba(255,255,255,.6)">248px</p></div>
<div style="flex:1;display:flex;flex-direction:column"><div style="height:34px;background:var(--stone-0);border-bottom:1px solid var(--border-subtle);display:grid;place-items:center"><p class="v">--app-topbar-h 60px</p></div>
<div style="flex:1;background:var(--surface-page);display:grid;place-items:center"><p class="v">--app-pad 24px · --layout-max 1200px</p></div></div></div></body></html>
