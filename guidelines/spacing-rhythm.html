<!-- @dsCard group="Spacing" viewport="700x180" name="Ritmo de seção" subtitle="96px de respiro; seções separadas por troca de fundo, nunca por régua" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="border-radius:var(--radius-sm);overflow:hidden">
<div style="background:var(--navy-900);padding:24px 20px;text-align:center"><p style="font:var(--fw-bold) 15px/1.3 var(--font-display);color:#fff;text-transform:uppercase">Seção sobre navy</p><p class="v" style="color:rgba(255,255,255,.5);margin-top:6px">padding-block: --section-y (96px)</p></div>
<div style="background:var(--stone-200);padding:24px 20px;text-align:center"><p style="font:var(--fw-regular) 15px/1.3 var(--font-display);color:var(--navy-900)">Faixa clara interrompe o navy</p><p class="v" style="margin-top:6px">sem borda, sem sombra — só troca de fundo</p></div>
<div style="background:var(--navy-900);padding:24px 20px;text-align:center"><p class="v" style="color:rgba(255,255,255,.5)">volta ao navy</p></div></div></body></html>
