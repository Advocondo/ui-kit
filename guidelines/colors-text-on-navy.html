<!-- @dsCard group="Colors" viewport="700x150" name="Texto sobre navy" subtitle="Hierarquia no escuro feita com branco em alfa, não com cinzas" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="background:var(--navy-900);padding:16px;border-radius:var(--radius-sm);display:grid;gap:8px">
<p style="font:var(--fw-medium) 15px/1.4 var(--font-sans);color:var(--text-on-inverse)">--text-on-inverse · #FFFFFF · títulos e rótulos</p>
<p style="font:var(--fw-light) 14px/1.5 var(--font-sans);color:var(--text-on-inverse-muted)">--text-on-inverse-muted · rgba(255,255,255,.66) · corpo e legendas</p>
<p style="font:var(--fw-regular) 12px/1.4 var(--font-sans);color:rgba(255,255,255,.42)">rgba(255,255,255,.42) · rótulos de seção na sidebar</p>
<div style="height:1px;background:var(--border-inverse)"></div><p class="v" style="color:rgba(255,255,255,.5)">--border-inverse · rgba(255,255,255,.22)</p></div></body></html>
