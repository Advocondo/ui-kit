<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="g">
<p style="font:var(--fw-semibold) 26px/1.28 var(--font-sans);color:var(--text-heading)">Processos <span class="v">--fs-h1 26 · 600</span></p>
<p style="font:var(--fw-semibold) 21px/1.28 var(--font-sans);color:var(--text-heading)">Prazos da semana <span class="v">--fs-h2 21 · 600</span></p>
<p style="font:var(--fw-semibold) 17px/1.3 var(--font-sans);color:var(--text-heading)">Movimentações recentes <span class="v">--fs-h3 17 · 600</span></p>
<p style="font:var(--fw-bold) 17px/1.3 var(--font-sans);color:var(--navy-900);text-transform:uppercase">Direito Condominial <span class="v" style="text-transform:none">card do site · 700 CAPS</span></p></div></body></html>
