<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}

</style></head><body><div class="r"><div class="sw" style="width:104px"><div class="chip" style="height:56px;background:var(--green-600);"></div><div><p class="n">green-600</p><p class="v">#1F6F4A</p></div></div><div class="sw" style="width:104px"><div class="chip" style="height:56px;background:var(--amber-600);"></div><div><p class="n">amber-600</p><p class="v">#A9761C</p></div></div><div class="sw" style="width:104px"><div class="chip" style="height:56px;background:var(--red-600);"></div><div><p class="n">red-600</p><p class="v">#A8322D</p></div></div><div class="sw" style="width:104px"><div class="chip" style="height:56px;background:var(--info-600);"></div><div><p class="n">info-600</p><p class="v">#0B2F5B</p></div></div></div></body></html>
