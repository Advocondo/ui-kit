<!-- @dsCard group="Brand" viewport="700x180" name="Estados de interação" subtitle="Hover escurece, press desce 1px, foco é anel navy de 3px" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="g">
<div class="r"><span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);background:var(--navy-600);color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans)">Repouso</span>
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);background:var(--navy-700);color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans)">Hover</span>
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);background:var(--navy-800);color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans);transform:translateY(1px)">Press</span>
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);background:var(--navy-600);color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans);box-shadow:var(--ring-focus)">Foco</span>
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);background:var(--navy-600);color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans);opacity:.45">Desabilitado</span></div>
<div class="r" style="background:var(--navy-900);padding:12px;border-radius:var(--radius-sm)">
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);border:1px solid #fff;color:#fff;font:var(--fw-medium) 13.5px/1 var(--font-sans)">Outline repouso</span>
<span style="display:inline-flex;align-items:center;height:38px;padding:0 18px;border-radius:var(--radius-sm);border:1px solid #fff;background:#fff;color:var(--navy-900);font:var(--fw-medium) 13.5px/1 var(--font-sans)">Outline hover</span></div></div></body></html>
