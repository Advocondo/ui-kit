<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="g"><div class="r"><div class="sw" style="width:150px"><div style="height:6px;border-radius:3px;background:var(--navy-200);position:relative;overflow:hidden"><span style="position:absolute;inset:0 40% 0 0;background:var(--navy-600);border-radius:3px"></span></div><p class="n">150ms</p><p class="v">--dur-fast · controles</p></div><div class="sw" style="width:150px"><div style="height:6px;border-radius:3px;background:var(--navy-200);position:relative;overflow:hidden"><span style="position:absolute;inset:0 40% 0 0;background:var(--navy-600);border-radius:3px"></span></div><p class="n">220ms</p><p class="v">--dur-normal · painéis</p></div><div class="sw" style="width:150px"><div style="height:6px;border-radius:3px;background:var(--navy-200);position:relative;overflow:hidden"><span style="position:absolute;inset:0 40% 0 0;background:var(--navy-600);border-radius:3px"></span></div><p class="n">360ms</p><p class="v">--dur-slow · carrossel</p></div><div class="sw" style="width:150px"><div style="height:6px;border-radius:3px;background:var(--navy-200);position:relative;overflow:hidden"><span style="position:absolute;inset:0 40% 0 0;background:var(--navy-600);border-radius:3px"></span></div><p class="n">600ms</p><p class="v">--dur-reveal · entrada de seção</p></div></div>
<p class="v">--ease-standard cubic-bezier(.4,0,.2,1) · --ease-out cubic-bezier(.16,1,.3,1)</p></div></body></html>
