<!-- @dsCard group="Brand" viewport="700x190" name="Cards e raios" subtitle="10px no site sobre navy; 6px + hairline na plataforma" -->
<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font:var(--type-body);padding:18px}
.g{display:grid;gap:10px}.r{display:flex;gap:10px;flex-wrap:wrap}
.sw{display:grid;gap:6px}.chip{height:56px;border-radius:var(--radius-sm)}
.n{font:var(--fw-semibold) 11px/1.3 var(--font-sans);color:var(--text-heading)}
.v{font:var(--fw-regular) 10px/1.3 var(--font-mono);color:var(--text-muted)}
.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div class="r" style="gap:14px;align-items:stretch">
<div style="flex:1;background:var(--navy-900);padding:16px;border-radius:var(--radius-sm);display:grid;place-items:center">
<div style="background:var(--stone-200);border-radius:var(--radius-md);box-shadow:var(--shadow-card-site);padding:14px;text-align:center">
<p style="font:var(--fw-bold) 13px/1.3 var(--font-sans);color:var(--navy-900);text-transform:uppercase">Direito Condominial</p>
<p style="font:var(--fw-light) 12px/1.6 var(--font-sans);color:var(--stone-700);margin-top:4px">10px · sem borda · sombra difusa</p></div></div>
<div style="flex:1;padding:16px;display:grid;place-items:center">
<div style="background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);box-shadow:var(--shadow-xs);padding:14px;text-align:center;width:100%">
<p style="font:var(--fw-semibold) 13px/1.3 var(--font-sans);color:var(--text-heading)">Prazos da semana</p>
<p class="v" style="margin-top:4px">6px · hairline --border-subtle · --shadow-xs</p></div></div></div></body></html>
