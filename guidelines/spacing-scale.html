<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

.lb{font:var(--type-eyebrow);letter-spacing:var(--ls-eyebrow);text-transform:uppercase;color:var(--text-muted)}
</style></head><body><div style="display:flex;align-items:flex-end;gap:10px"><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-1);height:var(--space-1);background:var(--navy-600);border-radius:2px"></div><p class="v">1</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-2);height:var(--space-2);background:var(--navy-600);border-radius:2px"></div><p class="v">2</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-3);height:var(--space-3);background:var(--navy-600);border-radius:2px"></div><p class="v">3</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-4);height:var(--space-4);background:var(--navy-600);border-radius:2px"></div><p class="v">4</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-5);height:var(--space-5);background:var(--navy-600);border-radius:2px"></div><p class="v">5</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-6);height:var(--space-6);background:var(--navy-600);border-radius:2px"></div><p class="v">6</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-8);height:var(--space-8);background:var(--navy-600);border-radius:2px"></div><p class="v">8</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-10);height:var(--space-10);background:var(--navy-600);border-radius:2px"></div><p class="v">10</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-12);height:var(--space-12);background:var(--navy-600);border-radius:2px"></div><p class="v">12</p></div><div style="display:grid;gap:5px;justify-items:center"><div style="width:var(--space-16);height:var(--space-16);background:var(--navy-600);border-radius:2px"></div><p class="v">16</p></div><div style="display:grid;gap:5px;justify-items:center"
